services:
  # 🗄️ MySQL Database
  mysql:
    image: mysql:8.0
    container_name: formbuilder_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret123
      MYSQL_DATABASE: formBuilder
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - appnet
    command: --default-authentication-plugin=mysql_native_password

  # ⚙️ Laravel Backend (PHP)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: formbuilder_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env # 👈 explicitly load Laravel's .env
    environment:
      APP_ENV: local
      APP_DEBUG: true
      APP_KEY: base64:HsPWnMUSxUA5hLNM9XSnmbJRRxs5sotFfMRA5Y6kE40=
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: formBuilder
      DB_USERNAME: app_user
      DB_PASSWORD: app_pass
      SANCTUM_STATEFUL_DOMAINS: localhost,127.0.0.1,localhost:3000,127.0.0.1:3000,::1
    ports:
      - "9000:9000"
    depends_on:
      - mysql
    networks:
      - appnet
    command: >
      sh -c "
        composer install &&
        php artisan key:generate --force &&
        php artisan migrate --force &&
        php artisan serve --host=0.0.0.0 --port=9000
      "

  # 💻 React Frontend (Vite)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: formbuilder_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE: http://localhost:9000/api
      CHOKIDAR_USEPOLLING: true
      WATCHPACK_POLLING: true
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - appnet
    command: npm run dev -- --host 0.0.0.0 --port 3000

  # 🌐 Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: formbuilder_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    networks:
      - appnet

# 🧱 Volumes
volumes:
  mysql_data:
  backend_storage:

# 🌍 Network
networks:
  appnet:
    driver: bridge
